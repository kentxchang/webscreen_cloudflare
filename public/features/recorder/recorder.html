<!-- 螢幕錄影 -->
<div class="modal" id="recorder-modal" style="width:320px;">
    <div class="modal-header">
        <div class="window-controls">
            <button class="window-btn close" onclick="closeRecorder()"></button>
            <button class="window-btn minimize" onclick="minimizeModal(this)"></button>
            <button class="window-btn maximize" onclick="maximizeModal(this)"></button>
        </div>
        <div class="modal-title">螢幕錄影</div>
    </div>
    <div class="modal-content">
        <div class="recorder-container">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 14px; color: #333;">
                    <input type="checkbox" id="enable-mic-audio" checked onchange="toggleMicrophonePreview()">
                    錄製麥克風聲音
                </label>
                <select id="microphone-select" style="width: 100%; padding: 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;" onchange="switchMicrophone()">
                    <option value="">載入中...</option>
                </select>
                <div style="margin-top: 10px;">
                    <div style="font-size: 12px; color: #666; margin-bottom: 3px;">麥克風音量</div>
                    <div style="width: 100%; height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; position: relative;">
                        <div id="mic-volume-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 50%, #FFC107 75%, #F44336 100%); transition: width 0.1s ease;"></div>
                    </div>
                    <div id="mic-volume-text" style="font-size: 11px; color: #999; text-align: center; margin-top: 2px;">0%</div>
                </div>
            </div>
            <button class="record-btn idle" id="record-btn" onclick="toggleRecording()">⏺</button>
            <div class="record-status" id="record-status">準備就緒</div>
        </div>
    </div>
</div>
