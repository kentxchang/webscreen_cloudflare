<!-- 抽籤系統 -->
<div class="modal" id="lottery-modal" style="width:350px;">
    <div class="modal-header">
        <div class="window-controls">
            <button class="window-btn close" onclick="closeModal('lottery-modal')"></button>
            <button class="window-btn minimize" onclick="minimizeModal(this)"></button>
            <button class="window-btn maximize" onclick="maximizeModal(this)"></button>
        </div>
        <div class="modal-title">抽籤系統</div>
    </div>
    <div class="modal-content">
        <div class="lottery-container">
            <div>
                <label>總人數：</label>
                <input type="number" class="lottery-input" id="lottery-total" value="30" min="1">
            </div>
            <div class="lottery-result" id="lottery-result">?</div>
            <button class="timer-btn timer-preset" onclick="drawLottery()">抽籤</button>
            <button class="timer-btn timer-action" onclick="resetLottery()">重置</button>
            <div class="lottery-history" id="lottery-history">已抽：</div>
        </div>
    </div>
</div>
